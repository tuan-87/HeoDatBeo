name: Deploy to Google Play Store

on:
  push:
    branches:
      - main

jobs:
  build-and-submit:
    name: Build & Submit Android to CH Play
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔄 Sync version and versionCode from version_history.json
        run: node sync-version.js

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🔑 Restore Google Service Account Key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            echo "$SERVICE_ACCOUNT_JSON" > google-service-account.json
          fi

      - name: 🔑 Restore .env (if provided in secrets)
        env:
          GEMINI_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_KEY" ]; then
            echo "EXPO_PUBLIC_GEMINI_API_KEY=$GEMINI_KEY" > .env
            echo "GEMINI_API_KEY=$GEMINI_KEY" >> .env
          fi

      - name: 🏗️ Build and Submit to Google Play
        run: |
          eas build --platform android --profile production --non-interactive --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_HEODATBEO_TOKEN || secrets.EXPO_TOKEN }}

      - name: 📝 Auto Update Google Play Release Notes from version_history.json
        run: |
          npm install --no-save google-auth-library
          node update-release-notes.js
